name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tools:
    name: tools and fixtures (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: tests for canlog.py and replay.py
        working-directory: tools
        run: python -m unittest discover -p 'test_*.py' -v

      - name: summary of every fixture
        run: |
          for f in test/fixtures/*.txt; do
            python tools/canlog.py "$f" | head -5
          done

      - name: reference decoder walks the logs
        run: |
          python tools/replay.py --every 500 test/fixtures/02_idle_60s.txt
          python tools/replay.py --every 500 test/fixtures/06_trip_reset.txt
          python tools/replay.py --every 100 test/fixtures/07_accel.txt

  core:
    name: C core (gcc on the host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Enforces the non-negotiable rule from CLAUDE.md: decode.c, compute.c
      # and txframes.c must not contain <xc.h>. Without this the core would
      # stop being testable on the host and the whole approach would quietly
      # fall apart.
      - name: core contains no hardware includes
        working-directory: test
        run: make check-pure

      - name: host tests
        working-directory: test
        run: make test

      # The other half of check-pure. XC8 is not installed here, so without
      # this the hardware half of the firmware would be six hundred lines that
      # nothing ever compiles. It is a syntax check against a stub xc.h and
      # proves nothing about the silicon — but it does prove that main.c still
      # calls the core with the arguments the core actually has.
      - name: the HAL and main.c still compile
        working-directory: test
        run: make check-hal

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The reference decoder in Python and the C core that will actually be
      # flashed must not drift apart. This replays every fixture through both
      # and diffs the totals; the fuel counter and the restart count have to
      # agree exactly, distance to within a tenth of a percent.
      - name: python reference and the C core agree
        run: python tools/replay.py --host-build test/fixtures/*.txt

  firmware:
    name: XC8 build
    runs-on: ubuntu-latest
    env:
      # Pinned on purpose, and pinned to whatever is installed on the desk. A
      # compiler that changes under the firmware without anyone deciding to
      # change it is not a compiler, it is weather.
      #
      # v4.00 is the current release and the only one Microchip's download page
      # still offers. Older versions are still reachable by direct URL — 2.36
      # through 2.50, 3.00, 3.10 all resolve — but pinning CI to a compiler
      # nobody has installed would only test a compiler nobody uses.
      XC8_VERSION: '4.00'
    steps:
      - uses: actions/checkout@v4

      - name: cache the XC8 install
        id: xc8-cache
        uses: actions/cache@v4
        with:
          path: /opt/microchip/xc8
          key: xc8-${{ env.XC8_VERSION }}-linux-x64

      # ~93 MB from Microchip, so it only happens on a cache miss. The
      # installer is a self-extracting shell script and takes --mode
      # unattended. No licence is activated or needed — v4 dropped the Free
      # mode restriction on the optimiser, which is why the build below is the
      # real -O2 one rather than -O0.
      - name: install XC8
        if: steps.xc8-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://ww1.microchip.com/downloads/aemDocuments/documents/DEV/ProductDocuments/SoftwareTools/xc8-v${XC8_VERSION}-full-install-linux-x64-installer.run"
          curl -fSL --retry 3 -o /tmp/xc8.run "$url"
          chmod +x /tmp/xc8.run
          sudo /tmp/xc8.run --mode unattended --unattendedmodeui none --netservername ''

      - name: xc8-cc reports for duty
        run: |
          echo "/opt/microchip/xc8/v${XC8_VERSION}/bin" >> "$GITHUB_PATH"

      # The real build, at the real optimisation level. If a Free-mode licence
      # ever does object to -O2 again, `make -C mplab OPT=-O0` is the fallback
      # and the hex is still a valid one to flash.
      - name: build the firmware
        run: make -C mplab

      - name: the hex file exists and is not empty
        run: |
          test -s mplab/build/canfuel.hex
          ls -l mplab/build/

      - uses: actions/upload-artifact@v4
        with:
          name: canfuel-hex
          path: mplab/build/canfuel.hex
          if-no-files-found: error
